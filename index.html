<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Win Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f4f6}
.hidden{display:none!important}

.login-box{
  width:90%;max-width:400px;margin:100px auto;padding:30px;
  background:#fff;border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.12)
}

input,button{
  width:100%;padding:13px;margin-top:10px;
  border-radius:8px;font-size:16px
}

input{border:1px solid #ddd}
button{border:0;background:#111827;color:white}

header{
  padding:16px;background:#111827;color:white;
  display:flex;justify-content:space-between;align-items:center
}

header h2{margin:0}
.logout{width:auto;margin:0;background:#dc2626}

.cards{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:15px;padding:20px
}

.card{
  background:white;padding:20px;border-radius:12px;
  text-align:center;box-shadow:0 3px 15px rgba(0,0,0,.08)
}

.card p{font-size:22px;font-weight:bold;margin:8px}

.section{
  background:white;margin:0 20px 20px;padding:20px;
  border-radius:12px
}

table{
  width:100%;border-collapse:collapse;
  margin-top:15px;font-size:14px
}

th,td{
  padding:10px;border-bottom:1px solid #ddd;
  text-align:left
}

.table-wrap{overflow-x:auto}

#message{text-align:center;margin-top:12px}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-box">
  <h1>Royal Win Admin</h1>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="message"></div>
</div>


<!-- DASHBOARD -->
<div id="dashboardPage" class="hidden">

<header>
  <h2>Royal Win Admin</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="cards">

  <div class="card">
    <h3>Users</h3>
    <p id="usersCount">0</p>
  </div>

  <div class="card">
    <h3>Wallets</h3>
    <p id="walletsCount">0</p>
  </div>

  <div class="card">
    <h3>Transactions</h3>
    <p id="transactionsCount">0</p>
  </div>

  <div class="card">
    <h3>Status</h3>
    <p>Online</p>
  </div>

</div>


<div class="section">
  <h2>Users</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="usersTable">
        <tr>
          <td colspan="4">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</div>


<script>

const SUPABASE_URL =
"https://mlntauvkzwwdfzopiokg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4iRexgwKdgCICs6SeAxPQQ_-H6nYBFy";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function login(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;

  const message =
  document.getElementById("message");

  if(!email || !password){
    message.textContent="Please enter email and password.";
    return;
  }

  message.textContent="Logging in...";

  const {data,error} =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    message.textContent=error.message;
    return;
  }

  const {data:admin,error:adminError} =
  await supabaseClient
  .from("admins")
  .select("role")
  .eq("user_id",data.user.id)
  .single();

  if(adminError || !admin){

    await supabaseClient.auth.signOut();

    message.textContent=
    "Access denied: Admin account required.";

    return;
  }

  document
  .getElementById("loginPage")
  .classList.add("hidden");

  document
  .getElementById("dashboardPage")
  .classList.remove("hidden");

  loadDashboard();
}


async function loadDashboard(){

  const users =
  await supabaseClient
  .from("users")
  .select("*",{count:"exact",head:true});

  const wallets =
  await supabaseClient
  .from("wallets")
  .select("*",{count:"exact",head:true});

  const transactions =
  await supabaseClient
  .from("transactions")
  .select("*",{count:"exact",head:true});

  document.getElementById("usersCount").textContent =
  users.count ?? 0;

  document.getElementById("walletsCount").textContent =
  wallets.count ?? 0;

  document.getElementById("transactionsCount").textContent =
  transactions.count ?? 0;

  loadUsers();
}


async function loadUsers(){

  const {data,error} =
  await supabaseClient
  .from("users")
  .select("name,phone,email,status")
  .order("created_at",{ascending:false})
  .limit(100);

  const table =
  document.getElementById("usersTable");

  if(error){
    table.innerHTML =
    `<tr><td colspan="4">Unable to load users.</td></tr>`;
    return;
  }

  if(!data || data.length===0){
    table.innerHTML =
    `<tr><td colspan="4">No users found.</td></tr>`;
    return;
  }

  table.innerHTML = data.map(user => `
    <tr>
      <td>${escapeHtml(user.name || "-")}</td>
      <td>${escapeHtml(user.phone || "-")}</td>
      <td>${escapeHtml(user.email || "-")}</td>
      <td>${escapeHtml(user.status || "-")}</td>
    </tr>
  `).join("");
}


function escapeHtml(value){

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


async function logout(){

  await supabaseClient.auth.signOut();

  document
  .getElementById("dashboardPage")
  .classList.add("hidden");

  document
  .getElementById("loginPage")
  .classList.remove("hidden");

  document.getElementById("password").value="";
}

</script>

</body>
</html>
